version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "17 3 7 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - m-arv
    versioning-strategy: increase
    cooldown:
      default: 7
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "42 3 7 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - m-arv
